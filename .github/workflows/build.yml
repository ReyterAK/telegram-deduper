name: build

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  build:
    needs: test
    # One runner for both targets: they differ only by GOARCH
    # (cross-compilation), so a matrix over os would only
    # duplicate the same ubuntu-latest runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          check-latest: true
      - name: build amd64
        env:
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags '-s -w' -o dist/antidubl-amd64 .
      - name: build arm64
        env:
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -ldflags '-s -w' -o dist/antidubl-arm64 .
      - uses: actions/upload-artifact@v4
        with:
          name: antidubl-linux-binaries
          path: dist/
